name: ci pipeline
on:
  push:
    branches:
      - main
jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: setup python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run Tests
        env:
          SECRET_KEYenv: ${{ secrets.SECRET_KEYenv }}
          ALGORITHMSenv: ${{ secrets.ALGORITHMSenv }}
          hostenv: ${{ secrets.hostenv }}
          portenv: ${{ secrets.portenv }}
          usernameenv: ${{ secrets.usernameenv }}
          passwordenv: ${{ secrets.passwordenv }}
        run: |
          python -m pytest
