<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ShortUrl converter</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
 <div class="container">
     <div class="left-section">
         <div class="logo">
           🔗 <span>ShortURL</span>
         </div>
         <div class="welcome">
             <h1>Welcome</h1>
             <h1>Back! 👋</h1>
             <p>
                 Sign in to your account and
                 continue shortening URLs
                 and tracking performance.
             </p>
         </div>
     </div>
     <div class="right-sec">
         <div class="content-box">
             <header>
                 <p>Login to ShortUrl</p>

             </header>
             <main>
                 <input  id="email" class="email" type="text" placeholder="Email" required>
                 <input  id="password" class="email" type="password" placeholder="Password" required>
                 <div class="options">
                     <label>
                         <input type="checkbox">
                         Remember me
                     </label>
                     <span>Forgot password?</span>
                 </div>

             </main>
             <footer>
                 <button id="loginbtn" class ="login">Login</button>
                 <p>Do not have an account ?<button class="sign" onclick="window.location.href='' ">Signup</button></p>
             </footer>
         </div>
     </div>
 </div>

</body>
<script src="script.js"></script>
</html>
