<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ShortUrl converter</title>
    <link rel="stylesheet" href="otp.css">
</head>
<body>
 <div class="container">
     <div class="left-section">
         <div class="logo">
           🔗 <span>ShortURL</span>
         </div>
         <div class="welcome">
             <h1>Welcome</h1>
             <h1>Back! 👋</h1>
             <p>
                 Sign in to your account and
                 continue shortening URLs
                 and tracking performance.
             </p>
         </div>
     </div>
     <div class="right-sec">
         <div class="content-box">
             <header>
                 <p>Verify Otp</p>

             </header>
             <main>
                 <input class="pass" type="text" placeholder="Enter Otp" required>

             </main>
             <footer>
                 <button class ="otp-verify" onclick="">Verify otp</button>
                 <p>Did not receive opt??<button class="resent" onclick="window.location.href='' ">Resent otp</button></p>

                 <button class ="otp-verify">Back to Login</button>
             </footer>
         </div>
     </div>
 </div>

</body>
</html>
