<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ShortUrl converter</title>
    <link rel="stylesheet" href="otp.css">
</head>
<body>
 <div class="container">
     <div class="left-section">
         <div class="logo">
           🔗 <span>ShortURL</span>
         </div>
         <div class="welcome">
             <h1>Welcome</h1>
             <h1>Back! 👋</h1>
             <p>
                 Sign in to your account and
                 continue shortening URLs
                 and tracking performance.
             </p>
         </div>
     </div>
     <div class="right-sec">
         <div class="content-box">
             <header>
                 <p>Reset password</p>

             </header>
             <main>
                 <input class="pass" id="pass" type="password" placeholder="Enter new password" required>
                 <input class="pass" id="conpass" type="password" placeholder="confirm new password" required>



             </main>
             <footer>
                 <button class ="otp-verify">Reset Password</button>
                 <p>remember your password?<button class="login" onclick="window.location.href='' ">Login</button></p>
             </footer>
         </div>
     </div>
 </div>

</body>
</html>
